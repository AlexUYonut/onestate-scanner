name: OneState Scanner Pro
on: 
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Lipește link-ul IPA'
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descărcare IPA
        run: wget -O game.ipa "${{ github.event.inputs.ipa_url }}"
          
      - name: Extragere Fișiere Joc
        run: |
          unzip game.ipa -d temp_ipa
          find temp_ipa -name "global-metadata.dat" -exec cp {} ./metadata.dat \;
          # Incearca sa gaseasca binarul, indiferent de nume
          find temp_ipa -name "UnityFramework" -exec cp {} ./binary \; || find temp_ipa -name "OneState" -exec cp {} ./binary \; || cp temp_ipa/Payload/*.app/OneState ./binary || echo "Binar negasit"

      - name: Scanare Ultra-Pro OneState
        run: |
          echo "=== REZULTATE SCANARE ONESTATE ===" > rezultate_scanare.txt
          # Folosim "|| true" la final ca sa nu dea eroare daca nu gaseste un cuvant
          strings -t x ./binary | grep -Ei "get_MoveSpeed|get_WalkSpeed|get_RunSpeed|get_SprintSpeed" >> rezultate_scanare.txt || true
          strings -t x ./binary | grep -Ei "get_JumpHeight|get_JumpPower|get_Gravity" >> rezultate_scanare.txt || true
          strings -t x ./binary | grep -Ei "get_Stamina|ConsumeStamina|m_Stamina" >> rezultate_scanare.txt || true
          
          # Verificam daca fisierul e gol
          if [ ! -s rezultate_scanare.txt ]; then
            echo "Nu am gasit offset-uri. Verificam toate string-urile de speed..." >> rezultate_scanare.txt
            strings -t x ./binary | grep -i "speed" | head -n 50 >> rezultate_scanare.txt || true
          fi

      - name: Salvare Rezultate
        uses: actions/upload-artifact@v4
        with:
          name: OneState-Final-Offsets
          path: |
            rezultate_scanare.txt
            metadata.dat
