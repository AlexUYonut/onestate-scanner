name: OneState Scanner Pro
on: 
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Lipește link-ul IPA'
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descărcare IPA
        run: wget -O game.ipa "${{ github.event.inputs.ipa_url }}"
          
      - name: Extragere Fișiere Joc
        run: |
          unzip game.ipa -d temp_ipa
          find temp_ipa -name "global-metadata.dat" -exec cp {} ./metadata.dat \;
          find temp_ipa -name "UnityFramework" -exec cp {} ./binary \; || find temp_ipa -name "OneState" -exec cp {} ./binary \;

      - name: Scanare Ultra-Pro OneState
        run: |
          echo "=== ANALIZA MISCARE (SPEED HACK) ===" > rezultate_scanare.txt
          strings -t x ./binary | grep -Ei "get_MoveSpeed|get_WalkSpeed|get_RunSpeed|get_SprintSpeed" >> rezultate_scanare.txt
          
          echo -e "\n=== ANALIZA FIZICA (BIG JUMP) ===" >> rezultate_scanare.txt
          strings -t x ./binary | grep -Ei "get_JumpHeight|get_JumpPower|get_Gravity" >> rezultate_scanare.txt
          
          echo -e "\n=== ANALIZA STAMINA ===" >> rezultate_scanare.txt
          strings -t x ./binary | grep -Ei "get_Stamina|ConsumeStamina|m_Stamina" >> rezultate_scanare.txt

      - name: Salvare Rezultate
        uses: upload-artifact@v4
        with:
          name: OneState-Final-Offsets
          path: |
            rezultate_scanare.txt
            metadata.dat
